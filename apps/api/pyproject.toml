[project]
name = "voicedesk-api"
version = "0.1.0"
description = "VoiceDesk booking API and semantic workflow"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "google-api-python-client>=2.180,<3",
  "google-auth>=2.40,<3",
  "google-auth-httplib2>=0.2,<1",
  "httplib2>=0.22,<1",
  "itsdangerous>=2.2,<3",
  "langchain>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "langgraph-checkpoint-sqlite>=2.0,<4",
  "openai>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=15,<17",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "mypy>=1.18,<2", "pytest>=8.4,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicedesk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]  # FastAPI uses Depends() in route signatures.

[tool.pytest.ini_options]
testpaths = ["tests"]

